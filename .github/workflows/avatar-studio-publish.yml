name: Avatar Studio - publish image assets

on:
  push:
    branches:
      - feature/avatar-studio
    paths:
      - src/assets/avatar.png
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# The published site always receives the original PNG, animated WebP and GIF
# in a single commit. Never commit a partially generated avatar set.
concurrency:
  group: avatar-studio-asset-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact staged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify published source and generator
        run: |
          test -f src/assets/avatar.png
          test -f scripts/generate-avatar-gif.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate standalone image assets
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python scripts/generate-avatar-gif.py

      - name: Verify source and both encoded outputs
        run: python3 scripts/verify-avatar-assets.py

      - name: Publish all three resources as one atomic Git commit
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          staged_dir="$RUNNER_TEMP/avatar-assets"
          mkdir -p "$staged_dir"
          cp src/assets/avatar.png "$staged_dir/avatar.png"
          cp public/favicon/wendell-avatar-animated.webp "$staged_dir/avatar.webp"
          cp public/favicon/wendell-avatar-animated.gif "$staged_dir/avatar.gif"

          # The generated files dirty the worktree; a later checkout of main can
          # differ from this branch, and Git refuses to switch over them.
          git checkout -- src/assets/avatar.png public/favicon/wendell-avatar-animated.webp public/favicon/wendell-avatar-animated.gif

          git fetch origin main
          git switch -C avatar-publish origin/main
          cp "$staged_dir/avatar.png" src/assets/avatar.png
          cp "$staged_dir/avatar.webp" public/favicon/wendell-avatar-animated.webp
          cp "$staged_dir/avatar.gif" public/favicon/wendell-avatar-animated.gif

          git add -- src/assets/avatar.png public/favicon/wendell-avatar-animated.webp public/favicon/wendell-avatar-animated.gif
          if git diff --cached --quiet; then
            echo "No changes to publish"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          staged_paths="$(git diff --cached --name-only | sort)"
          expected_paths="$(printf '%s\n' src/assets/avatar.png public/favicon/wendell-avatar-animated.gif public/favicon/wendell-avatar-animated.webp | sort)"

          # Nothing outside the three fixed asset paths may ride along, but a
          # subset is legitimate: a re-encoded PNG can leave one of the exports
          # byte-identical, and the file that must always be present is the
          # source PNG this run is publishing.
          unexpected="$(comm -23 <(printf '%s\n' "$staged_paths") <(printf '%s\n' "$expected_paths") || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected paths in the avatar commit:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          if ! printf '%s\n' "$staged_paths" | grep -qx 'src/assets/avatar.png'; then
            echo 'The avatar commit must contain the new PNG'
            exit 1
          fi
          for path in $expected_paths; do
            if ! printf '%s\n' "$staged_paths" | grep -qx "$path"; then
              echo "Note: $path is byte-identical to main and stays unchanged"
            fi
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(avatar): publish synchronized PNG WebP and GIF"

          pushed=false
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then pushed=true; break; fi
            echo "Push rejected (attempt $attempt); rebasing onto the latest main"
            git fetch origin main
            git rebase origin/main
          done
          if [ "$pushed" != true ]; then
            echo "Could not publish the avatar commit"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Deploy the already generated site assets
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_COMMIT: ${{ steps.publish.outputs.commit }}
        run: |
          set -euo pipefail
          # A push made with GITHUB_TOKEN does not start other workflows, so the
          # Pages build is dispatched explicitly. `--ref main` deploys whatever
          # main points at when the run starts, so refuse to dispatch if main
          # moved after our push: that would deploy a revision we did not verify.
          current="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$current" != "$PUBLISHED_COMMIT" ]; then
            echo "main is now $current but this run published $PUBLISHED_COMMIT."
            echo "The avatar commit is already on main; deploy it with a manual dispatch once main is quiet:"
            echo "  gh workflow run deploy.yml --ref main"
            exit 1
          fi
          gh workflow run deploy.yml --repo "${{ github.repository }}" --ref main
          echo "Dispatched deploy.yml for $PUBLISHED_COMMIT"
