name: Maintain Vesper links

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vesper-links-maintenance
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies for icon discovery
        run: npm ci
      - name: Check links, discover icons and aggregate RSS
        run: |
          node scripts/check-friend-links.mjs
          node scripts/discover-link-avatars.mjs
          node scripts/aggregate-friend-feeds.mjs
      - name: Publish status snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/links-status.json public/links-feed.json public/links-avatars.json public/avatars/sites
          if git diff --cached --quiet; then
            echo "No updates"
            exit 0
          fi
          git commit -m "chore(links): refresh health and RSS snapshots"
          git push
