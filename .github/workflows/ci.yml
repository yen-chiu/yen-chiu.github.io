name: "CI"
on:
  push:
    branches:
      - "master"
      - "hotfix/**"
    paths-ignore:
      - ".github/**"
      - "!.github/workflows/ci.yml"
      - ".gitignore"
      - "docs/**"
      - "README.md"
      - "LICENSE"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # 与部署用同一份 Ruby（.ruby-version）和同一份锁文件
    env:
      BUNDLE_FROZEN: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # for posts's lastmod

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          # 版本读 .ruby-version，不要在这里写死
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Build Assets
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm ci --no-audit --no-fund && npm run build

      - name: Check post front matter
        run: node tools/check-frontmatter.mjs

      - name: Test Site
        run: bash tools/test.sh
