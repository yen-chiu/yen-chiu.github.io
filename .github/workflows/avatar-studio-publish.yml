name: Avatar Studio - publish image assets

on:
  push:
    branches:
      - feature/avatar-studio
    paths:
      - src/assets/avatar.png
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# The published site always receives the original PNG, animated WebP and GIF
# in a single commit. Never commit a partially generated avatar set.
concurrency:
  group: avatar-studio-asset-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact staged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify published source and generator
        run: |
          test -f src/assets/avatar.png
          test -f scripts/generate-avatar-gif.py

      - name: Generate standalone image assets
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 scripts/generate-avatar-gif.py

      - name: Verify source and both encoded outputs
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          paths = [
              Path('src/assets/avatar.png'),
              Path('public/favicon/wendell-avatar-animated.webp'),
              Path('public/favicon/wendell-avatar-animated.gif'),
          ]
          for path in paths:
              assert path.is_file() and path.stat().st_size > 0, str(path)
              with Image.open(path) as image:
                  image.verify()
          for path in paths[1:]:
              with Image.open(path) as image:
                  assert image.size == (320, 320), str(path)
                  assert getattr(image, 'n_frames', 1) >= 2, str(path)
          print('Verified all three image assets')
          PY

      - name: Publish all three resources as one atomic Git commit
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/avatar-assets"
          cp src/assets/avatar.png "$RUNNER_TEMP/avatar-assets/avatar.png"
          cp public/favicon/wendell-avatar-animated.webp "$RUNNER_TEMP/avatar-assets/avatar.webp"
          cp public/favicon/wendell-avatar-animated.gif "$RUNNER_TEMP/avatar-assets/avatar.gif"
          git fetch origin main
          git switch -C avatar-publish origin/main
          cp "$RUNNER_TEMP/avatar-assets/avatar.png" src/assets/avatar.png
          cp "$RUNNER_TEMP/avatar-assets/avatar.webp" public/favicon/wendell-avatar-animated.webp
          cp "$RUNNER_TEMP/avatar-assets/avatar.gif" public/favicon/wendell-avatar-animated.gif
          git add -- src/assets/avatar.png public/favicon/wendell-avatar-animated.webp public/favicon/wendell-avatar-animated.gif
          if git diff --cached --quiet; then
            echo "No changes to publish"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(avatar): publish synchronized PNG WebP and GIF"
          # A normal push from GITHUB_TOKEN does not launch the Pages workflow;
          # explicitly dispatch it after the atomic commit is accepted.
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy the already generated site assets
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy.yml --repo "${{ github.repository }}" --ref main
