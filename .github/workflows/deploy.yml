name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 岁月标本馆要读完整 main 历史来统计每年的提交数，默认浅克隆会让它退化成“待核验”。
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      # 动画头像（public/favicon/wendell-avatar-animated.{webp,gif}）是提交进
      # 仓库的产物，由 scripts/generate-avatar-gif.py 在本地生成；CI 不再安装
      # Python/Pillow，避免构建依赖 pip 版本与网络。
      - name: Build
        run: node --check scripts/discover-link-avatars.mjs && node scripts/discover-link-avatars.mjs && node --check scripts/check-friend-links.mjs && node --check scripts/aggregate-friend-feeds.mjs && node --check scripts/build-links-history.mjs && node --check .github/scripts/process-friend-request.cjs && npm test && npm run build && node scripts/pages-paths.mjs && node scripts/category-taxonomy.test.mjs --built && node scripts/seo-audit.test.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    # PR 只跑构建校验，不发布：只有 main 的 push（或手动触发）才真正部署。
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

