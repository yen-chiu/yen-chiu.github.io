<!-- 三态主题：浅色 / 深色 / 跟随系统 -->
<script type="text/javascript">
  class ModeToggle {
    static get MODE_KEY() {
      return 'theme';
    }
    static get MODE_ATTR() {
      return 'data-mode';
    }
    static get DARK_MODE() {
      return 'dark';
    }
    static get LIGHT_MODE() {
      return 'light';
    }
    static get SYSTEM_MODE() {
      return 'system';
    }
    static get ID() {
      return 'mode-toggle';
    }

    constructor() {
      this.media = window.matchMedia('(prefers-color-scheme: dark)');
      this.button = null;
      this.menuButtons = [];

      this.applyInitial();
      this.watchSystem();

      document.addEventListener('DOMContentLoaded', () => {
        this.button = document.getElementById('theme-mode-toggle');
        this.menuButtons = Array.prototype.slice.call(
          document.querySelectorAll('[data-theme-mode]')
        );
        this.bind();
        this.updateUI();
      });
    }

    get storedMode() {
      const stored = localStorage.getItem(ModeToggle.MODE_KEY);
      if (stored === ModeToggle.DARK_MODE || stored === ModeToggle.LIGHT_MODE) {
        return stored;
      }

      const legacy = sessionStorage.getItem('mode');
      if (legacy === ModeToggle.DARK_MODE || legacy === ModeToggle.LIGHT_MODE) {
        localStorage.setItem(ModeToggle.MODE_KEY, legacy);
        sessionStorage.removeItem('mode');
        return legacy;
      }

      return null;
    }

    get mode() {
      return this.storedMode || ModeToggle.SYSTEM_MODE;
    }

    get isPreferDark() {
      return this.media.matches;
    }

    get systemTheme() {
      return this.isPreferDark ? ModeToggle.DARK_MODE : ModeToggle.LIGHT_MODE;
    }

    get resolvedTheme() {
      return this.mode === ModeToggle.SYSTEM_MODE ? this.systemTheme : this.mode;
    }

    get modeStatus() {
      return this.resolvedTheme;
    }

    get isDarkMode() {
      return this.resolvedTheme === ModeToggle.DARK_MODE;
    }

    get hasMode() {
      return this.storedMode !== null;
    }

    applyInitial() {
      if (this.storedMode) {
        document.documentElement.setAttribute(ModeToggle.MODE_ATTR, this.storedMode);
      } else {
        document.documentElement.removeAttribute(ModeToggle.MODE_ATTR);
      }
    }

    watchSystem() {
      this.media.addEventListener('change', () => {
        if (this.mode !== ModeToggle.SYSTEM_MODE) {
          return;
        }
        document.documentElement.removeAttribute(ModeToggle.MODE_ATTR);
        this.updateUI();
        this.notify();
      });
    }

    get menu() {
      return this.button ? this.button.parentElement.querySelector('.wx-theme-menu') : null;
    }

    bind() {
      if (!this.button) {
        return;
      }

      this.button.addEventListener('click', (event) => {
        event.preventDefault();
        event.stopPropagation();
        this.toggleMenu();
      });

      this.menuButtons.forEach((button) => {
        button.addEventListener('click', () => {
          this.setMode(button.dataset.themeMode);
        });
      });

      document.addEventListener('click', (event) => {
        if (!this.button.parentElement.contains(event.target)) {
          this.closeMenu();
        }
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          this.closeMenu();
        }
      });
    }

    toggleMenu(force) {
      const menu = this.menu;
      if (!menu) {
        return;
      }

      const open = typeof force === 'boolean' ? force : !menu.classList.contains('show');
      menu.classList.toggle('show', open);
      menu.setAttribute('aria-hidden', open ? 'false' : 'true');
      this.button.parentElement.classList.toggle('show', open);
      this.button.setAttribute('aria-expanded', open ? 'true' : 'false');

      if (open) {
        const active = menu.querySelector('[data-theme-mode="' + this.mode + '"]');
        const first = active || menu.querySelector('button');
        if (first) {
          first.focus();
        }
      }
    }

    setMode(mode) {
      if (
        mode !== ModeToggle.LIGHT_MODE &&
        mode !== ModeToggle.DARK_MODE &&
        mode !== ModeToggle.SYSTEM_MODE
      ) {
        return;
      }

      if (mode === ModeToggle.SYSTEM_MODE) {
        localStorage.removeItem(ModeToggle.MODE_KEY);
        document.documentElement.removeAttribute(ModeToggle.MODE_ATTR);
      } else {
        localStorage.setItem(ModeToggle.MODE_KEY, mode);
        document.documentElement.setAttribute(ModeToggle.MODE_ATTR, mode);
      }

      this.updateUI();
      this.notify();
      this.closeMenu();
      this.button.focus();
    }

    updateUI() {
      if (!this.button) {
        return;
      }

      const labels = {
        light: '浅色',
        dark: '深色',
        system: '跟随系统'
      };

      this.button.dataset.currentMode = this.mode;
      this.button.setAttribute('aria-label', '切换主题：' + labels[this.mode]);
      this.button.setAttribute('title', '主题：' + labels[this.mode]);

      this.menuButtons.forEach((button) => {
        const active = button.dataset.themeMode === this.mode;
        button.classList.toggle('active', active);
        button.setAttribute('aria-pressed', active ? 'true' : 'false');
      });
    }

    closeMenu() {
      if (!this.button) {
        return;
      }

      const menu = this.menu;
      if (menu) {
        menu.classList.remove('show');
        menu.setAttribute('aria-hidden', 'true');
      }
      this.button.parentElement.classList.remove('show');
      this.button.setAttribute('aria-expanded', 'false');
    }

    notify() {
      window.postMessage(
        {
          direction: ModeToggle.ID,
          message: this.resolvedTheme
        },
        '*'
      );
    }

    flipMode() {
      const order = [ModeToggle.LIGHT_MODE, ModeToggle.DARK_MODE, ModeToggle.SYSTEM_MODE];
      const next = order[(order.indexOf(this.mode) + 1) % order.length];
      this.setMode(next);
    }

    setDark() {
      this.setMode(ModeToggle.DARK_MODE);
    }

    setLight() {
      this.setMode(ModeToggle.LIGHT_MODE);
    }

    clearMode() {
      this.setMode(ModeToggle.SYSTEM_MODE);
    }
  }

  const modeToggle = new ModeToggle();
</script>
