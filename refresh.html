<div class="wx-refresh">
  <p class="wx-refresh-icon" aria-hidden="true">⟳</p>
  <h1>正在清理缓存…</h1>
  <p class="wx-refresh-note">
    会删掉本站的离线缓存和 Service Worker，重新拉一遍刚才那一页的 HTML、样式和脚本，再带你回去。<br>
    <strong>不会</strong>清除写作台的登录状态。
  </p>
  <p class="wx-refresh-status" id="wx-refresh-status">如果 3 秒后没有自动跳转，请点下面的按钮。</p>
  <p>
    <a class="wx-refresh-btn" id="wx-refresh-manual" href="/">回首页</a>
  </p>
</div>

<style>
  .wx-refresh {
    max-width: 32rem;
    margin: 4rem auto;
    padding: 0 1.25rem;
    text-align: center;
  }

  .wx-refresh-icon {
    margin: 0 0 0.5rem;
    color: var(--wx-accent);
    font-size: 2.5rem;
    line-height: 1;
    animation: wx-spin 1.2s linear infinite;
  }

  .wx-refresh h1 {
    margin-bottom: 0.75rem;
    font-size: 1.4rem;
  }

  .wx-refresh-note {
    color: var(--text-muted-color);
    font-size: 0.92rem;
    line-height: 1.8;
  }

  .wx-refresh-status {
    margin-top: 1.5rem;
    color: var(--text-muted-color);
    font-size: 0.82rem;
  }

  .wx-refresh-btn {
    display: inline-block;
    margin-top: 0.5rem;
    padding: 0.55rem 1.4rem;
    border-radius: 999px;
    background: var(--wx-gradient);
    color: #fff;
    font-size: 0.9rem;
    text-decoration: none;
  }

  .wx-refresh-btn:hover {
    color: #fff;
    text-decoration: none;
    opacity: 0.92;
  }

  @keyframes wx-spin {
    to {
      transform: rotate(360deg);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .wx-refresh-icon {
      animation: none;
    }
  }
</style>

<script>
  (function () {
    var status = document.getElementById('wx-refresh-status');

    function fallback(message) {
      if (status) status.textContent = message;
    }

    var tries = 0;

    function run() {
      if (typeof window.wxRefreshCache !== 'function') {
        /* defer 脚本可能还没执行完，最多等 2 秒 */
        tries += 1;
        if (tries < 40) {
          setTimeout(run, 50);
        } else {
          fallback('这个浏览器不支持脚本式清理，请手动删除站点数据后重试。');
        }
        return;
      }
      window.wxRefreshCache({
        onDone: function (caches, workers) {
          fallback('已清理 ' + caches + ' 份缓存、注销 ' + workers + ' 个 Service Worker，正在回到刚才那一页…');
        }
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', run);
    } else {
      run();
    }
  })();
</script>
