<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f2422">
    <meta name="description" content="凌晨两点十七分 —— 一个即时而安静的对话式小游戏，4 个结局，约 12 分钟。">
    <title>凌晨两点十七分 · 对话游戏</title>
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <link href="css/shell.css?v=790dfc7822" rel="stylesheet">
    <link href="css/game.css" rel="stylesheet">
    <link href="css/ambient.css?v=790dfc7822" rel="stylesheet">
    <script src="js/shell.js?v=790dfc7822"></script>
</head>

<body class="wd-page">
    <div class="wd-phone">
        <header class="wd-topbar">
            <a class="wd-icon-btn" href="index.html" title="回到聊天" aria-label="回到聊天">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M15 5l-7 7 7 7" />
                </svg>
            </a>
            <div class="wd-topbar__title">
                <strong>凌晨两点十七分</strong>
                <span id="wd-chapter">02:17 · 一个普通的深夜</span>
            </div>
            <span data-wd-apps-slot></span>
            <button type="button" class="wd-icon-btn" id="wd-menu-btn" aria-haspopup="true"
                aria-expanded="false" aria-label="菜单">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="5" cy="12" r="1.4" fill="currentColor" stroke="none" />
                    <circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none" />
                    <circle cx="19" cy="12" r="1.4" fill="currentColor" stroke="none" />
                </svg>
            </button>
        </header>

        <div class="wd-menu" id="wd-menu" hidden>
            <button type="button" id="wd-rewind">回到上一个选择</button>
            <button type="button" id="wd-speed">快速模式</button>
            <div class="wd-menu__sep"></div>
            <button type="button" id="wd-restart">从头再玩一次</button>
            <button type="button" id="wd-gallery">结局收集 <small id="wd-gallery-count">0 / 4</small></button>
        </div>

        <main class="wd-chat" id="wd-chat" aria-live="polite" aria-label="对话记录"></main>

        <div class="wd-typing" id="wd-typing" hidden aria-hidden="true">
            <span>对方正在输入</span><i></i><i></i><i></i>
        </div>

        <footer class="wd-choices" id="wd-choices" hidden>
            <p class="wd-choices__hint">挑一句你会说的话 <span id="wd-choices-hint"></span></p>
            <div class="wd-choices__list" id="wd-choices-list"></div>
        </footer>

        <!-- 开场 -->
        <section class="wd-overlay" id="wd-intro">
            <p class="wd-overlay__eyebrow">A Chat Story</p>
            <h1 class="wd-overlay__title">凌晨两点十七分</h1>
            <p class="wd-overlay__sub">
                十年没联系的高中同学，在凌晨两点十七分发来一条消息。<br>
                你只有一只手在键盘上，和剩下的一点点深夜。
            </p>
            <div class="wd-overlay__meta">
                <span>约 12 分钟</span>
                <span>4 个结局</span>
                <span>进度自动保存</span>
            </div>
            <div class="wd-overlay__actions">
                <button type="button" class="wd-btn" id="wd-start">开始对话</button>
                <button type="button" class="wd-btn wd-btn--ghost" id="wd-continue" hidden>继续上次</button>
            </div>
            <p class="wd-overlay__foot">
                没有对错，只有你当下会打出的那句话。<br>
                剧本原创；运行时与界面参考的开源项目见 <a href="credits.html">致谢</a> ·
                <a href="index.html">回聊天</a>
            </p>
        </section>

        <!-- 结局 -->
        <section class="wd-overlay" id="wd-ending" hidden></section>
    </div>

    <noscript>
        <p style="padding:24px;font-family:sans-serif;">这个对话游戏需要 JavaScript 才能运行。</p>
    </noscript>

    <script src="js/core/narrative.js"></script>
    <script src="js/game.js"></script>
    <script src="js/ambient.js?v=790dfc7822" defer></script>
</body>

</html>
