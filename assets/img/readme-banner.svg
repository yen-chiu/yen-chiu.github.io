<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" fill="none" role="img" aria-label="Wendell's Blog — 读书，买花，长大。">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#070a16"/>
      <stop offset="0.5" stop-color="#0b1030"/>
      <stop offset="1" stop-color="#170d33"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="84" y1="110" x2="640" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#dcd8ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.55" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="blobA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.3" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="1200" height="280" rx="24"/>
    </clipPath>
    <style>
      .drift-a { animation: da 18s ease-in-out infinite alternate; }
      .drift-b { animation: db 22s ease-in-out infinite alternate; }
      .scan { animation: scan 6.5s ease-in-out infinite; }
      .pulse { animation: pulse 3.2s ease-in-out infinite; }
      @keyframes da { from { transform: translate3d(0,0,0) } to { transform: translate3d(80px, 30px, 0) scale(1.1) } }
      @keyframes db { from { transform: translate3d(0,0,0) scale(1) } to { transform: translate3d(-60px,-20px,0) scale(1.15) } }
      @keyframes scan {
        0% { transform: translateX(-560px) skewX(-16deg); opacity: 0 }
        15% { opacity: .85 }
        55% { transform: translateX(980px) skewX(-16deg); opacity: 0 }
        100% { transform: translateX(980px) skewX(-16deg); opacity: 0 }
      }
      @keyframes pulse { 0%,100% { opacity: .3 } 50% { opacity: 1 } }
      @media (prefers-reduced-motion: reduce) {
        .drift-a, .drift-b, .scan, .pulse { animation: none }
      }
      .title {
        font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        font-size: 62px;
        font-weight: 800;
        letter-spacing: 1px;
      }
      .cn {
        font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        font-size: 24px;
        letter-spacing: 5px;
      }
      .mono {
        font-family: 'Cascadia Code', Consolas, monospace;
        font-size: 14px;
        letter-spacing: 2px;
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="280" fill="url(#bg)"/>
    <ellipse class="drift-a" cx="180" cy="20" rx="340" ry="200" fill="url(#blobA)" opacity="0.6"/>
    <ellipse class="drift-b" cx="1080" cy="260" rx="360" ry="200" fill="url(#blobB)" opacity="0.5"/>
    <rect width="1200" height="280" fill="url(#dots)"/>

    <g>
      <rect x="84" y="74" width="48" height="4" rx="2" fill="url(#accent)"/>
      <text class="title" x="84" y="148" fill="url(#titleGrad)">Wendell's Blog</text>
      <text class="cn" x="86" y="192" fill="#c9c5f4" fill-opacity="0.88">读书，买花，长大。</text>
      <text class="mono" x="86" y="228" fill="#8b8fb8">JEKYLL · CHIRPY · GITHUB PAGES</text>
    </g>

    <!-- 右侧：文章卡片示意 -->
    <g opacity="0.9">
      <rect x="806" y="62" width="316" height="156" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.14"/>
      <rect x="830" y="88" width="150" height="12" rx="6" fill="#ffffff" fill-opacity="0.55"/>
      <rect x="830" y="112" width="268" height="8" rx="4" fill="#ffffff" fill-opacity="0.22"/>
      <rect x="830" y="130" width="238" height="8" rx="4" fill="#ffffff" fill-opacity="0.18"/>
      <rect x="830" y="148" width="256" height="8" rx="4" fill="#ffffff" fill-opacity="0.14"/>
      <rect x="830" y="180" width="58" height="18" rx="9" fill="url(#accent)" opacity="0.85"/>
      <circle class="pulse" cx="906" cy="189" r="3" fill="#ffffff" fill-opacity="0.7"/>
    </g>

    <rect class="scan" x="-160" y="-60" width="150" height="400" fill="url(#shine)"/>
    <rect x="0.5" y="0.5" width="1199" height="279" rx="23.5" stroke="#ffffff" stroke-opacity="0.08"/>
  </g>
</svg>
