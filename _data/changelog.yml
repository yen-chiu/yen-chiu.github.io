# 站点更新日志
# ---------------------------------------------------------------------------
# 每条三行，写完就走。规则：
#   - 一次发布记一条，不按 commit
#   - note 一句话，别超过 40 字；写不下就写成文章
#   - kind: feature | fix | content | style | infra
#   - scope: 主站 | 写作台 | 子站
#   - links 可选，用「相关文章 / 提交」这类短标签
#   - 顺序：最新的写在最上面，页面按文件顺序渲染

