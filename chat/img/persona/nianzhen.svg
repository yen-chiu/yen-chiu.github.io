<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="念真">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fd1e1" />
      <stop offset="1" stop-color="#1fbfa6" />
    </linearGradient>
    <clipPath id="round">
      <rect width="96" height="96" rx="22" />
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="96" height="96" fill="url(#bg)" />

    <!-- 背景网格 -->
    <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="1">
      <path d="M0 74h96M0 86h96M24 0v96M48 0v96M72 0v96" />
    </g>

    <!-- 肩 -->
    <path d="M11 96c5-14 18-21 37-21s32 7 37 21z" fill="#12403d" opacity="0.92" />

    <!-- 脖子 -->
    <path d="M42.5 59h11v12c0 4-11 4-11 0z" fill="#e0b49b" />

    <!-- 头发（对称 bob）：比脸宽一圈，垂到下颌 -->
    <path d="M28 45c0-12 9-24 20-24s20 12 20 24v13a11 11 0 0 1-11 11H39a11 11 0 0 1-11-11z" fill="#232f33" />

    <!-- 脸 -->
    <ellipse cx="48" cy="46.5" rx="15.4" ry="17" fill="#f7dbc6" />

    <!-- 刘海：中分，对称，垂到眉毛上方 -->
    <path
      d="M33 44.6c1-10.8 7.4-18 15-18s14 7.2 15 18c-3.8-6.6-8.8-10-15-10s-11.2 3.4-15 10z"
      fill="#232f33"
    />
    <path d="M47.4 28.4c.7 2.4.8 4.7.3 6.9" stroke="#f7dbc6" stroke-opacity="0.5" stroke-width="1" fill="none" />

    <!-- 眉毛 -->
    <path d="M39 43.4c1.5-1 3.7-1 5.2 0" stroke="#232f33" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M51.8 42.7c1.7-.9 3.7-.7 5.1.4" stroke="#232f33" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- 眼睛：一只睁着，一只眯起来 -->
    <ellipse cx="42" cy="48.4" rx="2.4" ry="2.9" fill="#232f33" />
    <circle cx="41.1" cy="47.4" r="0.8" fill="#ffffff" opacity="0.9" />
    <path d="M53.2 49c1.2-1.6 3.2-1.6 4.4 0" stroke="#232f33" stroke-width="1.7" stroke-linecap="round" fill="none" />

    <!-- 腮红 -->
    <ellipse cx="36.2" cy="54.4" rx="3" ry="1.8" fill="#ef9b86" opacity="0.3" />
    <ellipse cx="59.8" cy="54.4" rx="3" ry="1.8" fill="#ef9b86" opacity="0.3" />

    <!-- 嘴 -->
    <path d="M45.2 56.2c1.4 1.8 4.2 1.8 5.6 0" stroke="#b5584a" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- 发夹 -->
    <rect x="57.8" y="31.2" width="6.8" height="2.1" rx="1.05" fill="#ffc25c" transform="rotate(18 61.2 32.2)" />

    <!-- 耳环 -->
    <circle cx="31.6" cy="52.6" r="1.2" fill="#ffc25c" />
  </g>
</svg>
