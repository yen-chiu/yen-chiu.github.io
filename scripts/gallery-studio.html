<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gallery Studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f3ef;color:#222;font:15px/1.6 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:32px 20px}header{border-bottom:1px solid #ccc;margin-bottom:24px}h1{font-size:36px;letter-spacing:-1px;margin:0}small{color:#666}.layout{display:grid;grid-template-columns:1.3fr 1fr;gap:32px}.preview{background:#e7e5df;min-height:280px;display:grid;place-items:center;padding:16px}.preview img{max-width:100%;max-height:520px}label{display:block;margin:12px 0}input:not([type=checkbox]),textarea{display:block;width:100%;padding:10px;border:1px solid #bbb;background:white;border-radius:5px;font:inherit}button{padding:12px 18px;border:0;border-radius:5px;background:#222;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.4}#status{white-space:pre-wrap;overflow-wrap:anywhere} @media(max-width:700px){.layout{grid-template-columns:1fr}}
</style><main><header><small>YENCHIU / LOCAL WORKSPACE</small><h1>Gallery Studio</h1><p>导入、整理与发布摄影作品</p></header><div class="layout"><section><label>选择照片<input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/tiff"></label><div class="preview"><img id="preview" alt="照片预览" hidden><span id="placeholder">选择一张导出的摄影作品</span></div><p id="info"></p><button id="compress" disabled>预览 WebP 压缩</button></section><form id="form"><label>作品标题<input name="title" required maxlength="300"></label><label>替代文字<input name="alt" required maxlength="300"></label><label>相册<input name="album" required maxlength="300"></label><label>拍摄日期<input name="date" type="date" required></label><label>摄影参数<input name="camera" maxlength="300"></label><label>作品说明<textarea name="caption" maxlength="2000"></textarea></label><label><input name="featured" type="checkbox"> 精选作品</label><label><input name="backup" type="checkbox"> 同时备份导入文件至私有桶</label><button id="publish" disabled>上传并更新照片索引</button><p id="status" role="status"></p><small>发布后仍需审查并提交 Git 照片索引。此工具仅限本机使用。</small></form></div></main><script>
const $=id=>document.getElementById(id),token='__STUDIO_TOKEN__';let image='',url='',busy=false
function controls(){ $('compress').disabled=$('publish').disabled=busy||!image;$('file').disabled=busy }
$('file').onchange=async()=>{image='';controls();const f=$('file').files[0];if(!f)return;if(f.size>32*1024*1024){$('status').textContent='文件超过 32 MiB，请先导出 JPEG';return}busy=true;controls();try{const reader=new FileReader();image=await new Promise((resolve,reject)=>{reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=reject;reader.readAsDataURL(f)});if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);$('preview').src=url;$('preview').hidden=true;$('preview').onload=()=>{$('preview').hidden=false;$('placeholder').hidden=true};$('info').textContent=f.name+' · '+(f.size/1024/1024).toFixed(2)+' MiB';$('status').textContent=''}catch(e){$('status').textContent=String(e)}finally{busy=false;controls()}}
async function request(path,data){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Studio-Token':token},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw Error(j.error);return j}
$('compress').onclick=async()=>{busy=true;controls();try{const r=await request('/preview',{image});$('preview').src='data:image/webp;base64,'+r.image;$('info').textContent='960px 预览 · '+Math.round(r.bytes/1024)+' KiB'}catch(e){$('status').textContent=e.message}finally{busy=false;controls()}}
$('form').onsubmit=async e=>{e.preventDefault();if(!image||busy||!confirm('确认上传公开衍生图片并更新本地索引？'))return;const f=new FormData(e.target),metadata=Object.fromEntries(f);metadata.featured=f.has('featured');busy=true;controls();$('status').textContent='正在发布…';try{await request('/publish',{image,metadata,backup:f.has('backup')});$('status').textContent='上传完成，索引已更新。请审查 Git 改动。'}catch(e){$('status').textContent=e.message}finally{busy=false;controls()}}
</script></html>
