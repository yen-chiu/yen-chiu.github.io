name: "CI"
on:
  push:
    branches:
      - "master"
      - "hotfix/**"
    paths-ignore:
      - ".github/**"
      - "!.github/workflows/ci.yml"
      - ".gitignore"
      - "docs/**"
      - "README.md"
      - "LICENSE"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 部署只用 3.3（见 .ruby-version），这里同样只测 3.3：
        # 避免同一份前端资源被重复构建三次（更慢，也更容易偶发失败）
        ruby: ["3.3"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # for posts's lastmod

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Build Assets
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm i --no-audit --no-fund && npm run build

      - name: Test Site
        run: bash tools/test.sh
