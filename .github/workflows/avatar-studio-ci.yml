name: Avatar Studio branch checks

on:
  push:
    branches:
      - feature/avatar-studio
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate Worker syntax and access-denial tests
        run: |
          node --check studio/worker.mjs
          node --test studio/worker.test.mjs
