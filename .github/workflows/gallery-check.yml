name: Gallery validation
on:
  pull_request:
    paths:
      - 'scripts/gallery-*'
      - 'src/pages/gallery/**'
      - 'src/pages/index.astro'
      - 'src/data/gallery-photos.json'
      - 'src/data/photos.ts'
      - 'src/lib/gallery.ts'
      - '.github/workflows/gallery-check.yml'
  push:
    branches: ['feat/photo-gallery']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          node --check scripts/gallery-studio.mjs
          node --check scripts/gallery-studio-server.mjs
          node --check scripts/gallery-studio-config.mjs
          node --test scripts/gallery-exif.test.mjs scripts/gallery-pipeline.test.mjs
      - run: npm test
      - run: npm run build
      - run: test -f dist/gallery/index.html
      - name: Configure isolated browser test directory
        run: echo "GALLERY_PLAYWRIGHT_DIR=$RUNNER_TEMP/gallery-playwright" >> "$GITHUB_ENV"
      - name: Install isolated browser test dependency
        run: |
          mkdir -p "$GALLERY_PLAYWRIGHT_DIR"
          npm install --prefix "$GALLERY_PLAYWRIGHT_DIR" --no-audit --no-fund playwright@1.56.1
          "$GALLERY_PLAYWRIGHT_DIR/node_modules/.bin/playwright" install --with-deps chromium
      - name: Local Studio desktop and mobile checks (synthetic data)
        run: node scripts/gallery-studio-browser-check.mjs
      - name: Build with temporary photography fixtures
        run: |
          node scripts/gallery-browser-check.mjs --fixture
          npm run build
      - name: Homepage and gallery desktop/mobile browser smoke tests
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/gallery-preview.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          node scripts/gallery-browser-check.mjs
