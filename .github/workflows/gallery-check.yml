name: Gallery validation
on:
  pull_request:
    paths:
      - 'scripts/gallery-*'
      - 'src/pages/gallery/**'
      - 'src/data/gallery-photos.json'
      - 'src/data/photos.ts'
      - 'src/lib/gallery.ts'
      - '.github/workflows/gallery-check.yml'
  push:
    branches: ['feat/photo-gallery']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          node --check scripts/gallery-studio.mjs
          node --check scripts/gallery-studio-server.mjs
          node --test scripts/gallery-exif.test.mjs scripts/gallery-pipeline.test.mjs
      - run: npm test
      - run: npm run build
      - run: test -f dist/gallery/index.html
